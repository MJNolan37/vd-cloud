name: Publish Atlas dashboard

on:
  push:
    branches: [main]
    paths:
      - 'atlas/index.html'
      - '.github/workflows/publish-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare the reviewed dashboard snapshot
        run: |
          mkdir -p _site
          cp atlas/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Atlas
        id: deployment
        uses: actions/deploy-pages@v4
